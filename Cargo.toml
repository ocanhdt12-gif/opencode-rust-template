[workspace]
resolver = "2"
members = ["crates/core", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""
rust-version = "1.74"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
opencode-core = { path = "crates/core" }
